[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "global-knowledge-crawl-pipeline"
version = "0.1.1"
description = "Global Knowledge Crawl Pipeline (by GKN): configurable discovery, collection, AI enrichment, and table export"
requires-python = ">=3.9"
authors = [{name = "GKN"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]
browser = ["playwright>=1.40,<2"]

[project.scripts]
gkp = "gkp.cli:main"

[tool.setuptools]
packages = ["gkp"]
